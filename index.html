<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dictation Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #ffffff; }
        button, input { margin: 10px 0; padding: 15px; width: 100%; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #007bff; color: white; font-weight: bold; }
        #outputDisplay { margin-top: 20px; font-size: 20px; color: #00ff00; }
    </style>
</head>
<body>

    <h2>AI Dictation System</h2>
    
    <!-- Step 1: User interaction to unlock audio on mobile -->
    <button id="initBtn">1. Initialize Earphones</button>
    <button id="resetBtn" style="background: #dc3545; margin-bottom: 20px;">Reset API Key</button>
    
    <!-- Step 2: Camera/Gallery Input -->
    <div style="margin-bottom: 15px;">
            <label for="targetQuestion" style="color: #666; font-family: sans-serif; font-size: 14px;">Enter Question Number (Optional): </label>
            <input type="number" id="targetQuestion" placeholder="e.g. 12" style="background: black; color: white; border: 1px solid #333; padding: 5px; border-radius: 4px; width: 60px; outline: none;">
        </div>
    <input type="file" id="imageInput" accept="image/*" multiple>
    
    <div id="outputDisplay">Waiting for image...</div>
    <!-- On-Screen Media Player -->
    <div id="mediaPlayer" style="display: none; text-align: center; margin-top: 20px; background: #222; padding: 15px; border-radius: 10px;">
        <div style="font-size: 14px; color: #888; margin-bottom: 15px;">Manual Controls</div>
        <button id="prevBtn" style="width: 22%; display: inline-block; background: #444; font-size: 20px;">⏮</button>
        <button id="playBtn" style="width: 22%; display: inline-block; background: #28a745; font-size: 20px;">▶</button>
        <button id="pauseBtn" style="width: 22%; display: inline-block; background: #ffc107; color: black; font-size: 20px;">⏸</button>
        <button id="nextBtn" style="width: 22%; display: inline-block; background: #444; font-size: 20px;">⏭</button>
    </div>

    <!-- The silent audio player that keeps Bluetooth controls active -->
    <audio id="silentAudio" src="silent.mp3" loop></audio>

    <script>
        let API_KEY = localStorage.getItem('gemini_api_key');
        if (!API_KEY) {
            API_KEY = prompt("Enter your Gemini API Key. It will be saved securely on this device.");
            if (API_KEY) localStorage.setItem('gemini_api_key', API_KEY);
        };
        let answerChunks = [];
        let currentIndex = 0;
        document.getElementById('resetBtn').addEventListener('click', () => {
    localStorage.removeItem('gemini_api_key');
    alert("API Key cleared! The page will now reload.");
    location.reload();
});

        // 1. INITIALIZE MEDIA & BLUETOOTH
        document.getElementById('initBtn').addEventListener('click', () => {
            // Chrome requires an active audio element to keep the Media Session API alive
            document.getElementById('silentAudio').play();
            
            let wakeUp = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(wakeUp);

            // This activates the in-ear detection hooks
            setupBluetoothControls(); 
            
            document.getElementById('initBtn').innerText = "System Active";
        });

        let advanceTimer;
        let clearVoice = null;

        // Force mobile Chrome to load available voices and pick the clearest one
        function loadClearVoice() {
            let voices = window.speechSynthesis.getVoices();
            // Prioritize clear Google voices or regional English
            clearVoice = voices.find(v => v.name.includes("Google UK English"))
                      || voices.find(v => v.name.includes("Google US English"))
                      || voices.find(v => v.lang === "en-IN")
                      || voices.find(v => v.lang.startsWith("en"))
                      || voices[0];
        }
        window.speechSynthesis.onvoiceschanged = loadClearVoice;
        loadClearVoice(); // Call immediately in case they are already loaded

// 2. SETUP BLUETOOTH IN-EAR DETECTION & TOUCH CONTROLS
        function setupBluetoothControls() {
            const bgAudio = document.getElementById('silentAudio');

            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'playing';

                navigator.mediaSession.setActionHandler('play', () => {
                    bgAudio.play();
                    navigator.mediaSession.playbackState = 'playing';
                    // Re-speak the current step from the beginning instead of using buggy resume()
                    speakCurrentChunk(); 
                });
                
                navigator.mediaSession.setActionHandler('pause', () => {
                    bgAudio.pause();
                    navigator.mediaSession.playbackState = 'paused';
                    // Instantly kill the speech engine instead of using buggy pause()
                    window.speechSynthesis.cancel();
                    clearTimeout(advanceTimer); 
                });
                
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    clearTimeout(advanceTimer);
                    if(currentIndex < answerChunks.length - 1) {
                        currentIndex++;
                        speakCurrentChunk();
                    }
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    clearTimeout(advanceTimer);
                    if(currentIndex > 0) {
                        currentIndex--;
                        speakCurrentChunk();
                    }
                });
            }

            // BACKUP: If Android bypasses the API and directly pauses the audio element
            bgAudio.addEventListener('pause', () => {
                window.speechSynthesis.cancel();
                clearTimeout(advanceTimer);
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            });

            bgAudio.addEventListener('play', () => {
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
                speakCurrentChunk();
            });
        }


// 3. DICTATION ENGINE WITH AUTO-FLOW & ON-SCREEN CONTROLS
function speakCurrentChunk() {
    window.speechSynthesis.cancel();
    clearTimeout(advanceTimer);

    if (answerChunks.length === 0 || currentIndex >= answerChunks.length) return;

    let text = answerChunks[currentIndex];

    // CLEAN UP QUESTION NUMBERS FOR FAST DICTATION
    text = text.replace(/Q\.\s*([0-9]+)/gi, "Q $1 ");
    text = text.replace(/Question\s*([0-9]+)/gi, "Q $1 ");

    // FIRST: Fix MCQ options so they drop the brackets and pronounce clearly
    // This catches "(a)" ONLY at the very start of the sentence
    text = text.replace(/^\s*\([aA]\)/g, " Option A A A, ");
    text = text.replace(/^\s*\([bB]\)/g, " Option B B B, ");
    text = text.replace(/^\s*\([cC]\)/g, " Option C C C, ");
    text = text.replace(/^\s*\([dD]\)/g, " Option D D D, ");

    // This catches "Option A" anywhere and forces the TTS to loudly spell it out
    text = text.replace(/option [aA]\b/gi, " Option A A A ");
    text = text.replace(/option [bB]\b/gi, " Option B B B ");
    text = text.replace(/option [cC]\b/gi, " Option C C C ");
    text = text.replace(/option [dD]\b/gi, " Option D D D ");
    
    // CHEMISTRY SYMBOL TRANSLATION
    text = text.replace(/->/g, " gives ");
    text = text.replace(/⇌/g, " is in equilibrium with ");
    text = text.replace(/E°/g, " E naught ");
    text = text.replace(/Δ/g, " delta ");
    text = text.replace(/°C/g, " degrees Celsius ");

    // FORCE SPACING IN CHEMICAL FORMULAS SO TTS READS EVERY LETTER
    text = text.replace(/([A-Z])(?=[A-Z])/g, "$1 "); // Converts HCHO to H C H O
    text = text.replace(/([a-z])(?=[A-Z])/g, "$1 "); // Converts NaCl to Na Cl
    text = text.replace(/([a-zA-Z])(?=[0-9])/g, "$1 "); // Converts CH4 to C H 4
    text = text.replace(/([0-9])(?=[a-zA-Z])/g, "$1 "); // Converts 2O to 2 O

    // FIX EXPONENTS AND INVERSES
    text = text.replace(/\^-\s*1/g, " inverse ");
    text = text.replace(/\^-\s*2/g, " to the power of minus two ");
    text = text.replace(/\^\s*2/g, " squared ");
    text = text.replace(/\^\s*3/g, " cubed ");

    // FIX SILENT HYPHENS IN ALGEBRA AND ELECTRONIC CONFIGURATIONS (e.g., n-1)
    text = text.replace(/([a-zA-Z0-9])\s*-\s*([0-9])/g, "$1 minus $2 ");
    
    // Catch flat text inverses (if AI forgets the ^ symbol)
    text = text.replace(/mol-1/gi, " mole inverse ");
    text = text.replace(/s-1/gi, " second inverse ");
    text = text.replace(/L-1/gi, " liter inverse ");
    
    // 100% Foolproof Bracket Translation
    text = text.replace(/<=/g, " less than or equal to ");
    text = text.replace(/>=/g, " greater than or equal to ");
    text = text.replace(/</g, " less than ");
    text = text.replace(/>/g, " greater than ");
 
    text = text.replace(/\(/g, " open first bracket ");
    text = text.replace(/\)/g, " close first bracket ");
    text = text.replace(/\{/g, " open second bracket ");
    text = text.replace(/\}/g, " close second bracket ");
    text = text.replace(/\[/g, " open third bracket ");
    text = text.replace(/\]/g, " close third bracket ");
    
    // Catch any formal words the AI might have stubbornly used
    text = text.replace(/parentheses/gi, "first brackets");
    text = text.replace(/curly braces/gi, "second brackets");

    document.getElementById('outputDisplay').innerText = `Step ${currentIndex + 1}: ${text}`;

    let utterance = new SpeechSynthesisUtterance(text);
    if (clearVoice) utterance.voice = clearVoice;
    utterance.rate = 0.6; // SLOWED DOWN FOR WRITING

    utterance.onend = () => {
        advanceTimer = setTimeout(() => {
            if (currentIndex < answerChunks.length - 1) {
                currentIndex++;
                speakCurrentChunk();
            }
        }, 4000); // 4-second gap remains untouched
    };

    window.speechSynthesis.speak(utterance);
}

        // On-Screen Button Logic
        document.getElementById('playBtn').addEventListener('click', () => {
            const bgAudio = document.getElementById('silentAudio');
            bgAudio.play(); 
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            
            // Restart the current chunk instead of resuming
            speakCurrentChunk(); 
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            document.getElementById('silentAudio').pause(); 
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            
            // Kill the audio instantly
            window.speechSynthesis.cancel();
            clearTimeout(advanceTimer); 
        });


        document.getElementById('prevBtn').addEventListener('click', () => {
            clearTimeout(advanceTimer);
            if(currentIndex > 0) {
                currentIndex--;
                speakCurrentChunk();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            clearTimeout(advanceTimer);
            if(currentIndex < answerChunks.length - 1) {
                currentIndex++;
                speakCurrentChunk();
            }
        });


        // 4. PROCESS IMAGE AND CALL GEMINI
        document.getElementById('imageInput').addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length === 0) return;

            document.getElementById('outputDisplay').innerText = `Processing ${files.length} images...`;

            // Convert all selected images to Base64 format
            const readPromises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        resolve({
                            inline_data: { 
                                mime_type: file.type, 
                                data: reader.result.split(',')[1] 
                            }
                        });
                    };
                    reader.readAsDataURL(file);
                });
            });

            // Wait for all images to process
            const imageParts = await Promise.all(readPromises);

const prompt = `You are a dictation assistant for high school STEM. Solve the problems across all the provided question paper pages in order.
CRITICAL INSTRUCTIONS:
1. Output ONLY a raw JSON array of strings. No markdown, no formatting.
2. Break the solution into extremely short, logical steps (under 15 words each).

3. QUESTION TYPE ROUTING (CRITICAL):
   - IF MCQ: Output exactly ONE step containing ONLY the correct option letter and its final value. Start with "Q. [Number] Option...".
   - IF NUMERICAL (Physical Chemistry calculations): Start step 1 explicitly with "Q. [Number] Given that..." listing all quantities. Dictate formulas, substitutions, and exact units.
   - IF THEORETICAL (Organic conversions, Inorganic reasoning, IUPAC naming): Start step 1 explicitly with "Q. [Number]" and jump DIRECTLY into the starting reactant, principle, or electronic configuration. NEVER use the word "Given" for theoretical questions.

4. STRICT CBSE NCERT FORMAT: Structure every solution exactly according to the Class 12 board step-marking scheme:
   - Numerical Middle steps: Show step-by-step substitution, molar mass evaluation, and intermediate conversions. Do not skip intermediate calculation steps.
   - Theoretical Middle steps: For conversions, dictate every intermediate product. Never skip reagents or reaction conditions.
   - Anti-Compression: NEVER perform mental math. If an intermediate variable, molar mass, standard potential, or intermediate reaction product is required, explicitly dictate the separate step to calculate or identify it.

5. CHAPTER-SPECIFIC NON-SKIP RULES:
   - Ch 1 Solutions: State Raoult's Law or Henry's Law formula before calculating. Explicitly show the separate calculation of solute molar mass M two. For colligative properties, always show the formula with the van 't Hoff factor i before substituting.
   - Ch 2 Electrochemistry: Explicitly dictate the half-cell reactions and the balanced overall cell reaction. Dictate the standard Nernst equation formula before substituting concentrations and the value of n. For conductivity, explicitly show the cell constant formula before calculating molar conductivity.
   - Ch 3 d- and f-Block Elements: Explicitly state the ground state and ionic electronic configurations (e.g., argon core three d five) before explaining anomalous properties, colored ions, oxidation states, or catalytic behavior. Explicitly dictate the spin-only magnetic moment formula mu equals square root of n times n plus two Bohr Magneton.
   - Ch 4 Haloalkanes and Haloarenes: Explicitly state whether the mechanism is S N one or S N two, mentioning carbocation stability or steric hindrance. For conversions, dictate every intermediate product.
   - Ch 5 Alcohols, Phenols and Ethers: Explicitly state the acid catalyst or temperature in dehydration reactions. For Kolbe's or Reimer-Tiemann, dictate the intermediate sodium phenoxide or intermediate aldehyde step. For Williamson synthesis, identify the specific alkyl halide and alkoxide used.
   - Ch 6 Aldehydes, Ketones and Carboxylic Acids: Explicitly state the chemical test name along with observation (e.g., silver mirror, red precipitate, yellow precipitate). For nucleophilic addition, Aldol condensation, or Cannizzaro reaction, show the intermediate adduct or carbanion step before the dehydrated or final product.

6. PHONETIC CHEMISTRY DICTATION (CRITICAL):
   - Brackets: NEVER say parentheses, curly braces, or square brackets. ALWAYS say "open first bracket" and "close first bracket" for (), "open second bracket" and "close second bracket" for {}, and "open third bracket" and "close third bracket" for [].
   - Letters & Numbers: ALWAYS say "capital M", "small m", "capital K", "digit zero", "the number two". NEVER let single letters sound ambiguous.
   - Fractions & Exponents: ALWAYS say "numerator is... denominator is..." or "whole divided by". Say "to the power of", "ten to the power minus three".
   - Chemical Formulas: Phonetically spell formulas out letter by letter and digit by digit. Say "C two H five O H", "C H three C H O", "H two S O four", "K M n O four", "K two C r two O seven".
   - Ions & Signs: Say "C u two plus", "F e three plus", "C l minus", "gives", "is in equilibrium with".
   - Ch 1 Solutions: Say "mole fraction x", "mass percentage", "parts per million", "molarity capital M", "molality small m", "cryoscopic constant K f", "ebullioscopic constant K b", "osmotic pressure pi", "van 't Hoff factor i".
   - Ch 2 Electrochemistry: Say "E naught cell", "standard reduction potential", "standard hydrogen electrode S H E", "Nernst equation", "limiting molar conductivity lambda naught m", "Faraday constant capital F", "cell constant G star", "Siemens per centimeter".
   - Ch 3 d- and f-Block: Say "argon core", "transition elements", "variable oxidation states", "unpaired electrons", "Bohr Magneton", "lanthanoid contraction", "potassium permanganate", "potassium dichromate", "interstitial compounds".
   - Ch 4 Haloalkanes & Haloarenes: Say "nucleophilic substitution", "S N one mechanism", "S N two mechanism", "retention of configuration", "inversion of configuration", "racemic mixture", "Markovnikov's rule", "anti-Markovnikov addition", "Grignard reagent", "Wurtz-Fittig reaction".
   - Ch 5 Alcohols, Phenols & Ethers: Say "Lucas reagent", "primary alcohol", "secondary alcohol", "tertiary alcohol", "dehydration", "phenol", "Reimer-Tiemann reaction", "Kolbe's reaction", "Williamson ether synthesis", "electrophilic aromatic substitution".
   - Ch 6 Aldehydes, Ketones & Carboxylic Acids: Say "carbonyl carbon", "nucleophilic addition", "Tollens' reagent silver mirror test", "Fehling's solution", "Iodoform test", "Aldol condensation", "Cross Aldol condensation", "Cannizzaro reaction", "Clemmensen reduction", "Wolff-Kishner reduction", "decarboxylation".
Ensure the text is optimized for audio text-to-speech without any visual ambiguity so a student can transcribe it perfectly without looking.`;

            let currentPrompt = prompt;
        const targetQ = document.getElementById('targetQuestion').value.trim();
        
        if (targetQ !== "") {
            currentPrompt += `\n\nCRITICAL OVERRIDE: The user has explicitly requested ONLY Question ${targetQ}. You MUST IGNORE all other questions on the provided pages. Output the solution ONLY for Question ${targetQ}.`;
        }
            const requestBody = {
                contents: [{
                    parts: [
                        { text: currentprompt },
                        ...imageParts // This adds all your images into the API request
                    ]
                }]
            };

            // Auto-Retry Logic for API Overloads (Extended)
            let maxRetries = 10;
            let attempt = 0;
            let success = false;

            while (attempt < maxRetries && !success) {
                try {
                    if (attempt > 0) {
                        document.getElementById('outputDisplay').innerText = `Server busy. Silently retrying... (Attempt ${attempt + 1} of ${maxRetries})`;
                        // Wait 5 seconds before trying again
                        await new Promise(resolve => setTimeout(resolve, 5000));
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message);
                    }
                    
        let rawText = data.candidates[0].content.parts[0].text;
        
        // Extract ONLY the array, ignoring any extra conversational text
        const jsonMatch = rawText.match(/\[[\s\S]*\]/);
        if (!jsonMatch) {
            throw new Error("AI failed to return a JSON array.");
        }
        
        answerChunks = JSON.parse(jsonMatch[0]);
        currentIndex = 0;
        success = true;
                    
                    speakCurrentChunk();
                    document.getElementById('mediaPlayer').style.display = 'block'; 

                } catch (error) {
                    attempt++;
                    document.getElementById('outputDisplay').innerText = "Error: " + error.message;
                    
                    if (attempt >= maxRetries) {
                        document.getElementById('outputDisplay').innerText += "\n\nFailed after 10 attempts. Please wait a minute and re-upload the images.";
                    }
                }
            }
        });

// 5. WAKE-LOCK AND STEALTH MODE
    let wakeLock = null;
    
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.error("Wake Lock failed:", err);
        }
    }

    // Re-request wake lock if tab visibility changes
    document.addEventListener('visibilitychange', () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            requestWakeLock();
        }
    });

    // Trigger wake lock when the system initializes
    document.getElementById('initBtn').addEventListener('click', () => {
        requestWakeLock();
    });

    // Double-tap the screen to activate/deactivate Pitch Black Stealth Mode
    document.body.addEventListener('dblclick', (e) => {
        // Prevent triggering if tapping a button
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        
        if (document.body.style.backgroundColor === 'black') {
            document.body.style.backgroundColor = '#1e1e1e';
            document.body.style.opacity = '1';
        } else {
            document.body.style.backgroundColor = 'black';
            document.body.style.opacity = '0.02'; // Dim enough to look off, but active enough to double-tap back
        }
    });

    </script>
</body>
</html>
