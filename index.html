<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dictation Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #ffffff; }
        button, input { margin: 10px 0; padding: 15px; width: 100%; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #007bff; color: white; font-weight: bold; }
        #outputDisplay { margin-top: 20px; font-size: 20px; color: #00ff00; }
    </style>
</head>
<body>

    <h2>AI Dictation System</h2>
    
    <!-- Step 1: User interaction to unlock audio on mobile -->
    <button id="initBtn">1. Initialize Earphones</button>
    <button id="resetBtn" style="background: #dc3545; margin-bottom: 20px;">Reset API Key</button>
    
    <!-- Step 2: Camera/Gallery Input -->
    <input type="file" id="imageInput" accept="image/*" multiple>
    
    <div id="outputDisplay">Waiting for image...</div>
    <!-- On-Screen Media Player -->
    <div id="mediaPlayer" style="display: none; text-align: center; margin-top: 20px; background: #222; padding: 15px; border-radius: 10px;">
        <div style="font-size: 14px; color: #888; margin-bottom: 15px;">Manual Controls</div>
        <button id="prevBtn" style="width: 22%; display: inline-block; background: #444; font-size: 20px;">⏮</button>
        <button id="playBtn" style="width: 22%; display: inline-block; background: #28a745; font-size: 20px;">▶</button>
        <button id="pauseBtn" style="width: 22%; display: inline-block; background: #ffc107; color: black; font-size: 20px;">⏸</button>
        <button id="nextBtn" style="width: 22%; display: inline-block; background: #444; font-size: 20px;">⏭</button>
    </div>

    <!-- The silent audio player that keeps Bluetooth controls active -->
    <audio id="silentAudio" src="silent.mp3" loop></audio>

    <script>
        let API_KEY = localStorage.getItem('gemini_api_key');
        if (!API_KEY) {
            API_KEY = prompt("Enter your Gemini API Key. It will be saved securely on this device.");
            if (API_KEY) localStorage.setItem('gemini_api_key', API_KEY);
        };
        let answerChunks = [];
        let currentIndex = 0;
        document.getElementById('resetBtn').addEventListener('click', () => {
    localStorage.removeItem('gemini_api_key');
    alert("API Key cleared! The page will now reload.");
    location.reload();
});

        // 1. INITIALIZE MEDIA & BLUETOOTH
        document.getElementById('initBtn').addEventListener('click', () => {
            // Chrome requires an active audio element to keep the Media Session API alive
            document.getElementById('silentAudio').play();
            
            let wakeUp = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(wakeUp);

            // This activates the in-ear detection hooks
            setupBluetoothControls(); 
            
            document.getElementById('initBtn').innerText = "System Active";
        });

        let advanceTimer;
        let clearVoice = null;

        // Force mobile Chrome to load available voices and pick the clearest one
        function loadClearVoice() {
            let voices = window.speechSynthesis.getVoices();
            // Prioritize clear Google voices or regional English
            clearVoice = voices.find(v => v.name.includes("Google UK English"))
                      || voices.find(v => v.name.includes("Google US English"))
                      || voices.find(v => v.lang === "en-IN")
                      || voices.find(v => v.lang.startsWith("en"))
                      || voices[0];
        }
        window.speechSynthesis.onvoiceschanged = loadClearVoice;
        loadClearVoice(); // Call immediately in case they are already loaded

// 2. SETUP BLUETOOTH IN-EAR DETECTION & TOUCH CONTROLS
        function setupBluetoothControls() {
            const bgAudio = document.getElementById('silentAudio');

            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'playing';

                navigator.mediaSession.setActionHandler('play', () => {
                    bgAudio.play();
                    navigator.mediaSession.playbackState = 'playing';
                    // Re-speak the current step from the beginning instead of using buggy resume()
                    speakCurrentChunk(); 
                });
                
                navigator.mediaSession.setActionHandler('pause', () => {
                    bgAudio.pause();
                    navigator.mediaSession.playbackState = 'paused';
                    // Instantly kill the speech engine instead of using buggy pause()
                    window.speechSynthesis.cancel();
                    clearTimeout(advanceTimer); 
                });
                
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    clearTimeout(advanceTimer);
                    if(currentIndex < answerChunks.length - 1) {
                        currentIndex++;
                        speakCurrentChunk();
                    }
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    clearTimeout(advanceTimer);
                    if(currentIndex > 0) {
                        currentIndex--;
                        speakCurrentChunk();
                    }
                });
            }

            // BACKUP: If Android bypasses the API and directly pauses the audio element
            bgAudio.addEventListener('pause', () => {
                window.speechSynthesis.cancel();
                clearTimeout(advanceTimer);
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            });

            bgAudio.addEventListener('play', () => {
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
                speakCurrentChunk();
            });
        }


// 3. DICTATION ENGINE WITH AUTO-FLOW & ON-SCREEN CONTROLS
function speakCurrentChunk() {
    window.speechSynthesis.cancel();
    clearTimeout(advanceTimer);

    if (answerChunks.length === 0 || currentIndex >= answerChunks.length) return;

    let text = answerChunks[currentIndex];

    // FIRST: Fix MCQ options so they drop the brackets and pronounce clearly
    // This catches "(a)" ONLY at the very start of the sentence
    text = text.replace(/^\s*\([aA]\)/g, " Option A A A, ");
    text = text.replace(/^\s*\([bB]\)/g, " Option B B B, ");
    text = text.replace(/^\s*\([cC]\)/g, " Option C C C, ");
    text = text.replace(/^\s*\([dD]\)/g, " Option D D D, ");

    // This catches "Option A" anywhere and forces the TTS to loudly spell it out
    text = text.replace(/option [aA]\b/gi, " Option A A A ");
    text = text.replace(/option [bB]\b/gi, " Option B B B ");
    text = text.replace(/option [cC]\b/gi, " Option C C C ");
    text = text.replace(/option [dD]\b/gi, " Option D D D ");
    
    // 100% Foolproof Bracket Translation
    text = text.replace(/<=/g, " less than or equal to ");
    text = text.replace(/>=/g, " greater than or equal to ");
    text = text.replace(/</g, " less than ");
    text = text.replace(/>/g, " greater than ");
 
    text = text.replace(/\(/g, " open first bracket ");
    text = text.replace(/\)/g, " close first bracket ");
    text = text.replace(/\{/g, " open second bracket ");
    text = text.replace(/\}/g, " close second bracket ");
    text = text.replace(/\[/g, " open third bracket ");
    text = text.replace(/\]/g, " close third bracket ");
    
    // Catch any formal words the AI might have stubbornly used
    text = text.replace(/parentheses/gi, "first brackets");
    text = text.replace(/curly braces/gi, "second brackets");

    document.getElementById('outputDisplay').innerText = `Step ${currentIndex + 1}: ${text}`;

    let utterance = new SpeechSynthesisUtterance(text);
    if (clearVoice) utterance.voice = clearVoice;
    utterance.rate = 0.6; // SLOWED DOWN FOR WRITING

    utterance.onend = () => {
        advanceTimer = setTimeout(() => {
            if (currentIndex < answerChunks.length - 1) {
                currentIndex++;
                speakCurrentChunk();
            }
        }, 4000); // 4-second gap remains untouched
    };

    window.speechSynthesis.speak(utterance);
}

        // On-Screen Button Logic
        document.getElementById('playBtn').addEventListener('click', () => {
            const bgAudio = document.getElementById('silentAudio');
            bgAudio.play(); 
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            
            // Restart the current chunk instead of resuming
            speakCurrentChunk(); 
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            document.getElementById('silentAudio').pause(); 
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            
            // Kill the audio instantly
            window.speechSynthesis.cancel();
            clearTimeout(advanceTimer); 
        });


        document.getElementById('prevBtn').addEventListener('click', () => {
            clearTimeout(advanceTimer);
            if(currentIndex > 0) {
                currentIndex--;
                speakCurrentChunk();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            clearTimeout(advanceTimer);
            if(currentIndex < answerChunks.length - 1) {
                currentIndex++;
                speakCurrentChunk();
            }
        });


        // 4. PROCESS IMAGE AND CALL GEMINI
        document.getElementById('imageInput').addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length === 0) return;

            document.getElementById('outputDisplay').innerText = `Processing ${files.length} images...`;

            // Convert all selected images to Base64 format
            const readPromises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        resolve({
                            inline_data: { 
                                mime_type: file.type, 
                                data: reader.result.split(',')[1] 
                            }
                        });
                    };
                    reader.readAsDataURL(file);
                });
            });

            // Wait for all images to process
            const imageParts = await Promise.all(readPromises);

            const prompt = `You are a dictation assistant for high school STEM. Solve the problems across all the provided question paper pages in order. 
            CRITICAL INSTRUCTIONS: 
            1. Output ONLY a raw JSON array of strings. No markdown, no formatting.
            2. Break the solution into extremely short, logical steps (under 15 words each).
            
            3. QUESTION TYPE ROUTING (CRITICAL):
               - IF MCQ (Multiple Choice): Output exactly ONE step containing ONLY the correct option letter and its final value. Skip all working.
               - IF SUBJECTIVE: Provide a full, rigorous step-by-step solution.
            
            4. STRICT CBSE NCERT FORMAT: Structure every solution exactly according to the Class 12 board step-marking scheme:
               - First step: Always begin with "Given that..."
               - Second step: Explicitly dictate the formula, property, or theorem being used before substituting values.
               - Middle steps: Show step-by-step substitution and evaluation. Do not skip intermediate calculation steps.
               - Final step: Conclude with the final answer and units, or explicitly state "hence proved".
               
            5. CHAPTER-SPECIFIC NON-SKIP RULES:
               - Ch 1: State definitions for reflexivity, symmetry, transitivity, one-one, or onto before testing.
               - Ch 2: State principal value branch and domain.
               - Ch 3: Evaluate LHL, RHL, and f(a) in separate steps.
               - Ch 4: State "taking log on both sides". Do not skip chain rule expansions.
               - Ch 5: State every row/column operation. State cofactor matrix before finding adjoint.
               - Ch 6 & 7: Dictate formula for shortest distance, dot/cross products, or projection before substituting.
               - Ch 8: State chain rule derivation.
               - Ch 9 & 10: State "equating f dash of x to zero". Strictly use First Derivative Test for maxima/minima. 
               - Ch 11: NEVER skip "completing the square". NEVER skip defining "t" for substitutions. NEVER skip linear equations for coefficients A and B.

            6. PHONETIC MATH DICTATION (CRITICAL): 
               - Brackets: NEVER say parentheses, curly braces, or square brackets. ALWAYS say "open first bracket" and "close first bracket" for (), "open second bracket" and "close second bracket" for {}, and "open third bracket" and "close third bracket" for [].
               - Single variables/numbers: NEVER say just "a", "e", "0", "2", "x". ALWAYS say "the variable a", "the constant e", "the digit zero", "the number two", "the variable x", "capital C".
               - Fractions & Exponents: For complex fractions, ALWAYS say "numerator is... denominator is..." or "whole divided by". Say "to the power of".
               - Ch 1: Say "union", "intersection", "proper subset", "subset", "null set phi", "element of", "function f from set A to set B".
               - Ch 2: Say "sine inverse of x", "cosine inverse", "tan inverse", "principal value branch", "pi by two", "angle theta".
               - Ch 3: Say "limit as x tends to a", "left hand limit", "right hand limit", "continuous at x equals c".
               - Ch 4: Say "derivative d y by d x", "second derivative d two y by d x squared", "f dash of x", "f double dash of x".
               - Ch 5: Say "Matrix A, row 1 elements are...", "Determinant of A equals", "transpose of A", "A inverse", "identity matrix I", "order two by two", "adjoint of A".
               - Ch 6: Say "vector a", "a cap", "magnitude of vector a", "i cap plus j cap plus k cap", "dot product", "cross product", "direction cosines l, m, and n".
               - Ch 7: Say "equation of the line", "x minus x one whole divided by a", "shortest distance", "position vector", "cartesian equation".
               - Ch 8: Say "rate of change of volume d V by d t", "d A by d t", "with respect to time t", "centimeters per second".
               - Ch 9: Say "strictly increasing", "strictly decreasing", "f dash of x is greater than zero", "open interval a comma b", "critical points".
               - Ch 10: Say "local maximum", "local minimum", "absolute maximum", "equate f dash of x to zero", "second derivative test".
               - Ch 11: Say "integral of... with respect to x", "d x", "plus constant of integration C", "let the variable t equal", "integral of e to the power x", "log mod x".
            Ensure the text is optimized for audio text-to-speech without any visual ambiguity so a student can transcribe it perfectly without looking.`;

            const requestBody = {
                contents: [{
                    parts: [
                        { text: prompt },
                        ...imageParts // This adds all your images into the API request
                    ]
                }]
            };

            // Auto-Retry Logic for API Overloads (Extended)
            let maxRetries = 10;
            let attempt = 0;
            let success = false;

            while (attempt < maxRetries && !success) {
                try {
                    if (attempt > 0) {
                        document.getElementById('outputDisplay').innerText = `Server busy. Silently retrying... (Attempt ${attempt + 1} of ${maxRetries})`;
                        // Wait 5 seconds before trying again
                        await new Promise(resolve => setTimeout(resolve, 5000));
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message);
                    }
                    
        let rawText = data.candidates[0].content.parts[0].text;
        
        // Extract ONLY the array, ignoring any extra conversational text
        const jsonMatch = rawText.match(/\[[\s\S]*\]/);
        if (!jsonMatch) {
            throw new Error("AI failed to return a JSON array.");
        }
        
        answerChunks = JSON.parse(jsonMatch[0]);
        currentIndex = 0;
        success = true;
                    
                    speakCurrentChunk();
                    document.getElementById('mediaPlayer').style.display = 'block'; 

                } catch (error) {
                    attempt++;
                    document.getElementById('outputDisplay').innerText = "Error: " + error.message;
                    
                    if (attempt >= maxRetries) {
                        document.getElementById('outputDisplay').innerText += "\n\nFailed after 10 attempts. Please wait a minute and re-upload the images.";
                    }
                }
            }
        });

// 5. WAKE-LOCK AND STEALTH MODE
    let wakeLock = null;
    
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.error("Wake Lock failed:", err);
        }
    }

    // Re-request wake lock if tab visibility changes
    document.addEventListener('visibilitychange', () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            requestWakeLock();
        }
    });

    // Trigger wake lock when the system initializes
    document.getElementById('initBtn').addEventListener('click', () => {
        requestWakeLock();
    });

    // Double-tap the screen to activate/deactivate Pitch Black Stealth Mode
    document.body.addEventListener('dblclick', (e) => {
        // Prevent triggering if tapping a button
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        
        if (document.body.style.backgroundColor === 'black') {
            document.body.style.backgroundColor = '#1e1e1e';
            document.body.style.opacity = '1';
        } else {
            document.body.style.backgroundColor = 'black';
            document.body.style.opacity = '0.02'; // Dim enough to look off, but active enough to double-tap back
        }
    });

    </script>
</body>
</html>
